[package]
name = "rs-tools"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rs_tools"
path = "src/lib.rs"

[[bin]]
name = "kline-analyze"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
